<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crochet Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#f2ead9; --cream-2:#ece1c9; --ink:#2c2620;
    --plum:#7a2e4a; --plum-dark:#5c2138;
    --sage:#7c8a5a; --sage-dark:#5f6b43;
    --gold:#c69344; --line:#d8c9a8; --white:#fffdf8; --danger:#a13d2e;
    --shadow: 0 2px 10px rgba(44,38,32,0.08); --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Karla',sans-serif;}
  body{min-height:100vh;}
  h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0 0 .3em 0;letter-spacing:-0.01em;}
  h1{font-size:2.1rem;font-style:italic;font-weight:500;}
  h2{font-size:1.5rem;} h3{font-size:1.15rem;}
  p{line-height:1.55;margin:.2em 0 1em;}
  a{color:var(--plum);}
  .mono{font-family:'Space Mono',monospace;}
  button, .btn{font-family:'Karla',sans-serif;font-weight:600;font-size:.88rem;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);padding:.55em 1.1em;border-radius:999px;cursor:pointer;transition:.15s ease;}
  button:hover, .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
  button.primary{background:var(--plum);border-color:var(--plum);color:var(--white);}
  button.primary:hover{background:var(--plum-dark);}
  button.sage{background:var(--sage);border-color:var(--sage);color:var(--white);}
  button.sage:hover{background:var(--sage-dark);}
  button.ghost{background:transparent;border-color:var(--line);}
  button.danger{background:var(--white);border-color:var(--danger);color:var(--danger);}
  button.danger:hover{background:var(--danger);color:var(--white);}
  button.small{padding:.3em .7em;font-size:.75rem;}
  button.icon{padding:.15em .55em;font-size:.95rem;line-height:1;border-radius:8px;}
  input, select, textarea{font-family:'Karla',sans-serif;font-size:.92rem;padding:.6em .75em;border:1.5px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);width:100%;}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--plum);outline-offset:1px;}
  label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.3em;color:var(--plum-dark);}
  .field{margin-bottom:.9em;}
  .stitch{height:14px;width:100%;margin:0;background-image:radial-gradient(circle, var(--gold) 2.5px, transparent 2.6px);background-size:16px 14px;background-position:center;opacity:.55;}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:1.1em 5%;flex-wrap:wrap;gap:.6em;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
  .brand{display:flex;align-items:baseline;gap:.5em;cursor:pointer;}
  .brand h1{font-size:1.5rem;margin:0;}
  .brand span{font-family:'Space Mono',monospace;font-size:.65rem;color:var(--sage-dark);letter-spacing:.08em;text-transform:uppercase;}
  .navlinks{display:flex;gap:.6em;align-items:center;font-size:.82rem;flex-wrap:wrap;}
  .wrap{max-width:1100px;margin:0 auto;padding:2.2em 5% 4em;}
  .hero{text-align:center;padding:2.2em 1em 1.4em;}
  .hero p.tag{font-family:'Space Mono',monospace;font-size:.75rem;letter-spacing:.15em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:.6em;}
  .chipbar{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;margin:1.4em 0;}
  .chip{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:.4em 1em;font-size:.8rem;cursor:pointer;}
  .chip.active{background:var(--ink);color:var(--white);border-color:var(--ink);}
  .searchbar{max-width:340px;margin:0 auto 1.2em;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.2em;margin-top:1em;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .card img{width:100%;height:170px;object-fit:cover;background:var(--cream-2);cursor:pointer;}
  .card .noimg{width:100%;height:170px;background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-style:italic;color:var(--sage-dark);opacity:.6;font-size:.9rem;}
  .imgcount{position:absolute;top:8px;right:8px;background:rgba(44,38,32,0.75);color:#fff;font-family:'Space Mono',monospace;font-size:.68rem;padding:.15em .55em;border-radius:999px;}
  .imgwrap{position:relative;}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(20,16,12,0.92);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:2em;}
  .lightbox-img{max-width:90vw;max-height:78vh;object-fit:contain;border-radius:8px;background:var(--cream-2);}
  .lightbox-close{position:absolute;top:1.2em;right:1.4em;background:transparent;border:1.5px solid var(--white);color:var(--white);border-radius:999px;width:2.4em;height:2.4em;font-size:1.2rem;cursor:pointer;}
  .lightbox-nav{display:flex;gap:1.5em;align-items:center;margin-top:1em;}
  .lightbox-nav button{background:transparent;border:1.5px solid var(--white);color:var(--white);}
  .lightbox-nav span{color:var(--white);font-family:'Space Mono',monospace;font-size:.8rem;}
  .thumbrow{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.5em;}
  .thumbrow .thumb-lg{width:80px;height:70px;max-width:80px;position:relative;}
  .thumbrow .rm{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:none;border-radius:999px;width:1.3em;height:1.3em;font-size:.7rem;line-height:1;cursor:pointer;padding:0;}
  .card .body{padding:.9em 1em 1.1em;flex:1;display:flex;flex-direction:column;}
  .card .tagrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4em;}
  .badge{font-family:'Space Mono',monospace;font-size:.68rem;padding:.2em .6em;border-radius:999px;background:var(--cream-2);color:var(--ink);border:1px solid var(--line);}
  .badge.stock{background:#eaf0e0;color:var(--sage-dark);border-color:#c9d8b4;}
  .badge.seller{background:#f3e6ea;color:var(--plum-dark);border-color:#e3c3ce;}
  .badge.sold{background:#eee;color:#777;border-color:#ddd;}
  .card h4{margin-bottom:.15em;font-size:1.05rem;}
  .card .desc{font-size:.85rem;color:#5a5248;flex:1;}
  .itemnum{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--sage-dark);}
  .login-wrap{max-width:380px;margin:3em auto;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:2em 1.8em;box-shadow:var(--shadow);}
  .login-wrap h2{text-align:center;}
  .login-wrap p.hint{text-align:center;font-size:.8rem;color:#8a8072;}
  .dash-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6em;margin-bottom:1em;}
  .tabs{display:flex;gap:.4em;flex-wrap:wrap;margin-bottom:1.6em;border-bottom:1px solid var(--line);padding-bottom:.8em;}
  .tab{padding:.5em 1em;border-radius:999px;font-size:.82rem;cursor:pointer;border:1.5px solid transparent;font-weight:600;color:#7a7264;}
  .tab.active{background:var(--ink);color:var(--white);}
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1em;margin-bottom:1.8em;}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:1.1em 1.2em;box-shadow:var(--shadow);}
  .stat .num{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;color:var(--plum);}
  .stat .lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#8a8072;font-weight:600;}
  table{width:100%;border-collapse:collapse;background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  th,td{text-align:left;padding:.7em .8em;border-bottom:1px solid var(--line);font-size:.85rem;vertical-align:middle;}
  th{background:var(--cream-2);font-family:'Space Mono',monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;}
  tr:last-child td{border-bottom:none;}
  .tablewrap{overflow-x:auto;}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:1.5em;box-shadow:var(--shadow);margin-bottom:1.5em;}
  .row{display:flex;gap:.8em;flex-wrap:wrap;align-items:flex-end;}
  .row .field{flex:1;min-width:150px;}
  .actions{display:flex;gap:.4em;flex-wrap:wrap;margin-top:.5em;}
  .catlist{display:flex;flex-wrap:wrap;gap:.6em;margin-top:1em;}
  .cattag{background:var(--cream-2);border:1px solid var(--line);border-radius:999px;padding:.4em 1em;font-size:.82rem;display:flex;align-items:center;gap:.5em;}
  .cattag button{padding:.1em .5em;font-size:.7rem;border-radius:6px;}
  .empty{text-align:center;color:#8a8072;padding:2.5em 1em;font-family:'Fraunces',serif;font-style:italic;}
  .footnote{font-size:.75rem;color:#8a8072;margin-top:.3em;}
  .msg{padding:.7em 1em;border-radius:8px;font-size:.85rem;margin-bottom:1em;}
  .msg.err{background:#f8e3df;color:var(--danger);border:1px solid #eabbb2;}
  .qtybox{display:flex;align-items:center;gap:.4em;}
  .qtybox .n{min-width:1.6em;text-align:center;font-family:'Space Mono',monospace;font-weight:700;}
  .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--cream-2);}
  .thumb-lg{width:100%;max-width:160px;height:120px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--cream-2);}
  .sellerchips{display:flex;flex-wrap:wrap;gap:.3em;margin-top:.3em;}
  .sellerchip{font-size:.7rem;background:#f3e6ea;color:var(--plum-dark);border:1px solid #e3c3ce;border-radius:999px;padding:.15em .6em;font-family:'Space Mono',monospace;}
  #printArea{display:none;}
  @media print{ body *{visibility:hidden;} #printArea, #printArea *{visibility:visible;} #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:20px;} }
  @media (max-width:640px){ .nav{padding:1em 4%;} .wrap{padding:1.6em 4% 3em;} h1{font-size:1.6rem;} }
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>

<script>
/* ---------- Firebase setup ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyC-mvmvVAiLiMsI_xP_eQ1Hyjll_ENmhgg",
  authDomain: "crochet-shop-d0bdf.firebaseapp.com",
  projectId: "crochet-shop-d0bdf",
  storageBucket: "crochet-shop-d0bdf.firebasestorage.app",
  messagingSenderId: "1020269754972",
  appId: "1:1020269754972:web:00cb806b74c0d74d8fc499"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/* ---------- storage helpers (Firestore-backed, shared across all visitors) ---------- */
async function sGet(key, fallback){
  try{
    const snap = await db.collection('shopData').doc(key).get();
    return snap.exists ? snap.data().value : fallback;
  }catch(e){ console.error('Firestore get failed', e); return fallback; }
}
async function sSet(key, value){
  try{ await db.collection('shopData').doc(key).set({ value }); }
  catch(e){ console.error('Firestore set failed', e); alert('Could not save — check your internet connection and try again.'); }
}

/* ---------- state ---------- */
let state = {
  view: 'public',
  ownerTab: 'overview',
  session: null,          // {role:'owner'} | {role:'seller', sellerId}
  categories: [],
  items: [],
  sellers: [],            // {id, name, password}
  sales: [],
  config: { shopName:'Crochet Corner', tagline:'Handmade, one stitch at a time', currency:'₹', ownerPass:'owner123' },
  publicFilter: 'all',
  publicSearch: '',
  sellerTab: 'assigned',
  lightbox: null, // {itemId, index}
  loading: true,
  loginError: ''
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return state.config.currency + Number(n||0).toFixed(2).replace(/\.00$/,''); }
function today(){ return new Date().toISOString().slice(0,10); }
function sellerName(id){ const s = state.sellers.find(x=>x.id===id); return s ? s.name : 'Unknown'; }
function sellerTotalQty(sellerId){
  return state.items.reduce((sum,it)=> sum + (it.sellerQty && it.sellerQty[sellerId] ? it.sellerQty[sellerId] : 0), 0);
}
function itemSellerTotal(it){
  if(!it.sellerQty) return 0;
  return Object.values(it.sellerQty).reduce((a,b)=>a+b,0);
}
function itemAvailableQty(it){ return (it.qtyInStock||0) + itemSellerTotal(it); }
function itemThumb(it){ return (it.images && it.images.length) ? it.images[0] : (it.image || ''); }

/* ---------- init ---------- */
async function init(){
  const [cats, items, sellers, sales, cfg] = await Promise.all([
    sGet('categories', ['Amigurumi','Blankets','Bags','Wearables']),
    sGet('items', []),
    sGet('sellers', []),
    sGet('sales', []),
    sGet('config', null)
  ]);
  state.categories = cats;
  state.items = items.map(it => {
    const merged = Object.assign({ qtyInStock:0, sellerQty:{}, image:'', images:[], cp:0 }, it);
    if((!merged.images || !merged.images.length) && merged.image) merged.images = [merged.image];
    return merged;
  });
  state.sellers = sellers;
  state.sales = sales;
  if(cfg) state.config = Object.assign(state.config, cfg);
  state.loading = false;
  render();
}

/* ---------- nav ---------- */
function goPublic(){ state.view='public'; state.loginError=''; render(); }
function goOwnerLogin(){ state.view='ownerLogin'; state.loginError=''; render(); }
function goSellerLogin(){ state.view='sellerLogin'; state.loginError=''; render(); }
function logout(){ state.session=null; state.view='public'; render(); }

function renderNav(){
  let right = '';
  if(state.session && state.session.role==='owner'){
    right = `<span class="badge stock">Owner</span> <button class="ghost small" onclick="state.view='ownerDash';render()">Dashboard</button> <button class="ghost small" onclick="logout()">Log out</button>`;
  } else if(state.session && state.session.role==='seller'){
    right = `<span class="badge seller">${esc(sellerName(state.session.sellerId))}</span> <button class="ghost small" onclick="state.view='sellerDash';render()">Dashboard</button> <button class="ghost small" onclick="logout()">Log out</button>`;
  } else {
    right = `<button class="ghost small" onclick="goSellerLogin()">Seller login</button><button class="ghost small" onclick="goOwnerLogin()">Owner login</button>`;
  }
  return `<div class="nav">
    <div class="brand" onclick="goPublic()"><h1>${esc(state.config.shopName)}</h1><span>crochet studio</span></div>
    <div class="navlinks">${right}</div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(state.loading){ app.innerHTML = '<div class="wrap"><p class="empty">Loading your studio…</p></div>'; return; }
  let body = '';
  if(state.view === 'public') body = renderPublic();
  else if(state.view === 'ownerLogin') body = renderOwnerLogin();
  else if(state.view === 'sellerLogin') body = renderSellerLogin();
  else if(state.view === 'ownerDash' && state.session && state.session.role==='owner') body = renderOwnerDash();
  else if(state.view === 'sellerDash' && state.session && state.session.role==='seller') body = renderSellerDash();
  else { state.view='public'; body = renderPublic(); }
  app.innerHTML = renderNav() + body + (state.lightbox ? renderLightbox() : '');
}

/* ---------- LIGHTBOX ---------- */
function openLightbox(itemId, index){
  state.lightbox = { itemId, index: index||0 };
  render();
}
function closeLightbox(){ state.lightbox = null; render(); }
function lightboxStep(delta){
  const it = state.items.find(i=>i.id===state.lightbox.itemId); if(!it) return;
  const imgs = it.images && it.images.length ? it.images : (it.image ? [it.image] : []);
  if(!imgs.length) return;
  state.lightbox.index = (state.lightbox.index + delta + imgs.length) % imgs.length;
  render();
}
function renderLightbox(){
  const it = state.items.find(i=>i.id===state.lightbox.itemId);
  if(!it) return '';
  const imgs = it.images && it.images.length ? it.images : (it.image ? [it.image] : []);
  if(!imgs.length) return '';
  const idx = state.lightbox.index;
  const nav = imgs.length > 1 ? `
    <div class="lightbox-nav">
      <button onclick="lightboxStep(-1)">‹ Prev</button>
      <span>${idx+1} / ${imgs.length}</span>
      <button onclick="lightboxStep(1)">Next ›</button>
    </div>` : '';
  return `<div class="lightbox-overlay" onclick="if(event.target===this) closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <img class="lightbox-img" src="${imgs[idx]}" alt="${esc(it.name)}">
    ${nav}
  </div>`;
}

/* ---------- PUBLIC VIEW ---------- */
function renderPublic(){
  const filtered = state.items.filter(it => {
    const catOk = state.publicFilter==='all' || it.category===state.publicFilter;
    const s = state.publicSearch.toLowerCase();
    const searchOk = !s || (it.name+' '+it.description).toLowerCase().includes(s);
    return catOk && searchOk;
  });
  const chips = ['all', ...state.categories].map(c =>
    `<button class="chip ${state.publicFilter===c?'active':''}" onclick="state.publicFilter='${esc(c)}';render()">${c==='all'?'All':esc(c)}</button>`
  ).join('');
  let cards = filtered.map(it => {
    const thumb = itemThumb(it);
    const count = (it.images && it.images.length) ? it.images.length : (it.image ? 1 : 0);
    return `
    <div class="card">
      <div class="imgwrap">
        ${thumb ? `<img src="${thumb}" alt="${esc(it.name)}" onclick="openLightbox('${it.id}',0)">` : `<div class="noimg">🧶 no photo yet</div>`}
        ${count > 1 ? `<span class="imgcount">1/${count}</span>` : ''}
      </div>
      <div class="body">
        <div class="tagrow"><span class="badge stock">${esc(it.category)}</span><span class="itemnum">#${esc(it.itemNumber)}</span></div>
        <h4>${esc(it.name)}</h4>
        <p class="desc">${esc(it.description || '')}</p>
        <p class="mono" style="font-weight:700;color:var(--plum);margin:0;">${money(it.price)}</p>
      </div>
    </div>`;
  }).join('');
  if(!filtered.length) cards = `<div class="empty">Nothing here yet — check back soon 🧶</div>`;
  return `<div class="wrap">
    <div class="hero"><p class="tag">Handmade catalog</p><h1>${esc(state.config.shopName)}</h1><p>${esc(state.config.tagline)}</p></div>
    <div class="stitch"></div>
    <div class="searchbar"><input placeholder="Search items…" value="${esc(state.publicSearch)}" oninput="state.publicSearch=this.value;render()" /></div>
    <div class="chipbar">${chips}</div>
    <div class="grid">${cards}</div>
  </div>`;
}

/* ---------- LOGIN ---------- */
function renderOwnerLogin(){
  return `<div class="wrap"><div class="login-wrap">
    <h2>Owner login</h2><p class="hint">Enter your password to continue</p>
    ${state.loginError ? `<div class="msg err">${esc(state.loginError)}</div>` : ''}
    <form onsubmit="handleOwnerLogin(event)">
      <div class="field"><label>Password</label><input type="password" name="pw" autofocus required /></div>
      <button class="primary" style="width:100%" type="submit">Log in</button>
    </form>
    <p class="footnote" style="text-align:center;margin-top:1em;"><a href="#" onclick="goPublic();return false;">← back to catalog</a></p>
  </div></div>`;
}
function handleOwnerLogin(e){
  e.preventDefault();
  if(e.target.pw.value === state.config.ownerPass){
    state.session = {role:'owner'}; state.view = 'ownerDash'; state.loginError='';
  } else { state.loginError = 'Incorrect password. Try again.'; }
  render();
}
function renderSellerLogin(){
  const body = `
    <form onsubmit="handleSellerLogin(event)">
      <div class="field"><label>Your name</label><input type="text" name="sellerName" required placeholder="Enter your name" autofocus /></div>
      <div class="field"><label>Password</label><input type="password" name="pw" required /></div>
      <button class="primary" style="width:100%" type="submit">Log in</button>
    </form>`;
  return `<div class="wrap"><div class="login-wrap">
    <h2>Seller login</h2><p class="hint">Type your name and enter your password</p>
    ${state.loginError ? `<div class="msg err">${esc(state.loginError)}</div>` : ''}
    ${body}
    <p class="footnote" style="text-align:center;margin-top:1em;"><a href="#" onclick="goPublic();return false;">← back to catalog</a></p>
  </div></div>`;
}
function handleSellerLogin(e){
  e.preventDefault();
  const typedName = e.target.sellerName.value.trim();
  const pw = e.target.pw.value;
  const seller = state.sellers.find(s=>s.name.toLowerCase()===typedName.toLowerCase());
  if(seller && seller.password === pw){
    state.session = {role:'seller', sellerId: seller.id}; state.view='sellerDash'; state.sellerTab='assigned'; state.loginError='';
  } else { state.loginError = 'Incorrect name or password.'; }
  render();
}

/* ---------- OWNER DASHBOARD ---------- */
function ownerTabBtn(id, label){ return `<div class="tab ${state.ownerTab===id?'active':''}" onclick="state.ownerTab='${id}';render()">${label}</div>`; }
function renderOwnerDash(){
  const tabs = ownerTabBtn('overview','Overview') + ownerTabBtn('items','Items') + ownerTabBtn('categories','Categories') + ownerTabBtn('sellers','Sellers') + ownerTabBtn('sales','Sales log') + ownerTabBtn('settings','Settings');
  let content = '';
  if(state.ownerTab==='overview') content = renderOverview();

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxW = 700;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
let pendingImages = [];
async function handlePhotoPick(input){
  const files = Array.from(input.files || []); if(!files.length) return;
  for(const file of files){
    const dataUrl = await compressImage(file);
    pendingImages.push(dataUrl);
  }
  input.value = '';
  renderPendingPreview();
}
function removePendingImage(i){ pendingImages.splice(i,1); renderPendingPreview(); }
function renderPendingPreview(){
  const el = document.getElementById('photoPreviewRow'); if(!el) return;
  el.innerHTML = pendingImages.map((src,i)=>`<div class="thumb-lg"><img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;"><button type="button" class="rm" onclick="removePendingImage(${i})">✕</button></div>`).join('');
}

function adjustStock(id, delta){
  const it = state.items.find(i=>i.id===id); if(!it) return;
  it.qtyInStock = Math.max(0, (it.qtyInStock||0) + delta);
  sSet('items', state.items);
  render();
}
function giveToSeller(id){
  const it = state.items.find(i=>i.id===id); if(!it) return;
  if(!state.sellers.length){ alert('Register a seller first, in the Sellers tab.'); return; }
  const names = state.sellers.map(s=>s.name).join(', ');
  const name = prompt('Give to which seller? ('+names+')');
  if(!name) return;
  const seller = state.sellers.find(s=>s.name.toLowerCase()===name.trim().toLowerCase());
  if(!seller){ alert('No seller found with that name.'); return; }
  const qtyStr = prompt('How many units of "'+it.name+'" to give '+seller.name+'? (in stock: '+it.qtyInStock+')', '1');
  if(!qtyStr) return;
  const qty = parseInt(qtyStr,10);
  if(!qty || qty<1 || qty>it.qtyInStock){ alert('Enter a valid quantity up to your current stock.'); return; }
  it.qtyInStock -= qty;
  it.sellerQty = it.sellerQty || {};
  it.sellerQty[seller.id] = (it.sellerQty[seller.id]||0) + qty;
  sSet('items', state.items);
  render();
}
function returnFromSeller(id){
  const it = state.items.find(i=>i.id===id); if(!it) return;
  const holders = Object.entries(it.sellerQty||{}).filter(([,q])=>q>0);
  if(!holders.length){ alert('This item is not currently with any seller.'); return; }
  const names = holders.map(([sid,q])=>sellerName(sid)+' ('+q+')').join(', ');
  const name = prompt('Return from which seller? ('+names+')');
  if(!name) return;
  const seller = state.sellers.find(s=>s.name.toLowerCase()===name.trim().toLowerCase());
  if(!seller || !it.sellerQty[seller.id]){ alert('That seller does not currently hold this item.'); return; }
  const qtyStr = prompt('How many to return to stock? (they hold '+it.sellerQty[seller.id]+')', '1');
  if(!qtyStr) return;
  const qty = parseInt(qtyStr,10);
  if(!qty || qty<1 || qty>it.sellerQty[seller.id]){ alert('Enter a valid quantity.'); return; }
  it.sellerQty[seller.id] -= qty;
  it.qtyInStock = (it.qtyInStock||0) + qty;
  sSet('items', state.items);
  render();
}
function deleteItem(id){
  if(!confirm('Delete this item permanently? This also removes its sales history.')) return;
  state.items = state.items.filter(i=>i.id!==id);
  state.sales = state.sales.filter(s=>s.itemId!==id);
  sSet('items', state.items); sSet('sales', state.sales);
  render();
}
function openSellForm(id){
  const it = state.items.find(i=>i.id===id); if(!it) return;
  const holders = Object.entries(it.sellerQty||{}).filter(([,q])=>q>0);
  let source = 'stock';
  if(holders.length){
    const opts = 'you ('+it.qtyInStock+'), ' + holders.map(([sid,q])=>sellerName(sid)+' ('+q+')').join(', ');
    const who = prompt('Who sold it? Type "you" or a seller name.\nAvailable: '+opts, 'you');
    if(who===null) return;
    if(who.trim().toLowerCase() !== 'you'){
      const seller = state.sellers.find(s=>s.name.toLowerCase()===who.trim().toLowerCase());
      if(!seller || !it.sellerQty[seller.id]){ alert('Invalid seller for this item.'); return; }
      source = seller.id;
    }
  }
  const maxQty = source==='stock' ? it.qtyInStock : it.sellerQty[source];
  if(!maxQty){ alert('No quantity available from that source.'); return; }
  const qtyStr = prompt('How many sold?', '1');
  if(!qtyStr) return;
  const qty = parseInt(qtyStr,10);
  if(!qty || qty<1 || qty>maxQty){ alert('Enter a valid quantity up to '+maxQty+'.'); return; }
  const priceStr = prompt('Price per unit ('+state.config.currency+')', it.price);
  if(priceStr===null) return;
  const price = Number(priceStr);
  const date = prompt('Date sold (YYYY-MM-DD)', today());
  if(date===null) return;
  if(source==='stock') it.qtyInStock -= qty; else it.sellerQty[source] -= qty;
  state.sales.push({
    id: uid(), itemId: it.id, itemName: it.name, itemNumber: it.itemNumber, category: it.category,
    qty, price, total: price*qty, date, soldBy: source==='stock' ? 'You' : sellerName(source)
  });
  sSet('items', state.items); sSet('sales', state.sales);
  render();
}

function exportBackup(){
  const data = { categories: state.categories, items: state.items, sellers: state.sellers, sales: state.sales, config: state.config };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'crochet-shop-backup.json'; a.click();
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(reader.result);
      if(data.categories) state.categories = data.categories;
      if(data.items) state.items = data.items.map(it => {
        const merged = Object.assign({ qtyInStock:0, sellerQty:{}, image:'', images:[], cp:0 }, it);
        if((!merged.images || !merged.images.length) && merged.image) merged.images = [merged.image];
        return merged;
      });
      if(data.sellers) state.sellers = data.sellers;
      if(data.sales) state.sales = data.sales;
      if(data.config) state.config = Object.assign(state.config, data.config);
      await Promise.all([sSet('categories', state.categories), sSet('items', state.items), sSet('sellers', state.sellers), sSet('sales', state.sales), sSet('config', state.config)]);
      alert('Backup restored.'); render();
    }catch(err){ alert('Could not read that file.'); }
  };
  reader.readAsText(file);
}

  const tabs = sellerTabBtn('assigned','Assigned to me') + sellerTabBtn('all','All items');
  let content = state.sellerTab==='all' ? renderSellerAllItems() : renderSellerAssigned(sellerId);

  return `<div class="wrap">
    <h2>Welcome, ${esc(seller ? seller.name : '')}</h2>
    <div class="stat-row">
      <div class="stat"><div class="num">${myTotal}</div><div class="lbl">Items with you</div></div>
      <div class="stat"><div class="num">${ownerStock}</div><div class="lbl">Items maker has in stock</div></div>
    </div>
    <div class="tabs">${tabs}</div>
    ${content}
  </div>`;
}
function renderSellerAllItems(){
  const rows = state.items.slice().sort((a,b)=> a.category.localeCompare(b.category)).map(it=>`
    <tr>
      <td>${itemThumb(it) ? `<img class="thumb" src="${itemThumb(it)}" style="cursor:pointer;" onclick="openLightbox('''+it.id+''',0)">` : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:.7rem;">—</div>`}</td>
      <td class="mono">#${esc(it.itemNumber)}</td><td>${esc(it.category)}</td><td>${esc(it.name)}</td><td>${money(it.cp)}</td>
    </tr>`).join('');
  return `<div class="panel"><h3>All items (cost price)</h3>
    <p class="footnote">This is what each item costs you from the maker's side.</p>
    <div class="tablewrap"><table><thead><tr><th>Photo</th><th>#</th><th>Category</th><th>Item</th><th>Cost price</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="5">No items uploaded yet.</td></tr>'}</tbody></table></div>
  </div>`;
}
function renderSellerAssigned(sellerId){
  const myItems = state.items.filter(it => it.sellerQty && it.sellerQty[sellerId] > 0);
  const rows = myItems.map(it=>`
    <tr>
      <td>${itemThumb(it) ? `<img class="thumb" src="${itemThumb(it)}" style="cursor:pointer;" onclick="openLightbox('''+it.id+''',0)">` : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;font-size:.7rem;">—</div>`}</td>
      <td class="mono">#${esc(it.itemNumber)}</td><td>${esc(it.category)}</td><td>${esc(it.name)}</td>
      <td>${money(it.cp)}</td><td>${it.sellerQty[sellerId]}</td>
      <td><button class="small primary" onclick="markSoldBySeller('${it.id}')">Sold</button></td>
    </tr>`).join('');
  return `<div class="panel"><h3>Your assigned items</h3>
    <div class="tablewrap"><table><thead><tr><th>Photo</th><th>#</th><th>Category</th><th>Item</th><th>Cost price</th><th>Qty with you</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7">No items assigned to you right now.</td></tr>'}</tbody></table></div>
  </div>`;
}
function markSoldBySeller(itemId){
  const sellerId = state.session.sellerId;
  const seller = state.sellers.find(s=>s.id===sellerId);
  const it = state.items.find(i=>i.id===itemId); if(!it) return;
  const have = (it.sellerQty && it.sellerQty[sellerId]) || 0;
  if(!have){ alert('You do not currently hold this item.'); return; }
  const qtyStr = prompt('How many did you sell? (you have '+have+')', '1');
  if(!qtyStr) return;
  const qty = parseInt(qtyStr,10);
  if(!qty || qty<1 || qty>have){ alert('Enter a valid quantity up to '+have+'.'); return; }
  const priceStr = prompt('Price you sold it for, per unit ('+state.config.currency+')', it.price);
  if(priceStr===null) return;
  const price = Number(priceStr);
  const date = prompt('Date sold (YYYY-MM-DD)', today());
  if(date===null) return;
  it.sellerQty[sellerId] -= qty;
  state.sales.push({
    id: uid(), itemId: it.id, itemName: it.name, itemNumber: it.itemNumber, category: it.category,
    qty, price, total: price*qty, date, soldBy: seller ? seller.name : 'Seller'
  });
  sSet('items', state.items); sSet('sales', state.sales);
  alert('Marked as sold - this now also shows in the owner sales log.');
  render();
}

init();
</script>
</body>
</html>
